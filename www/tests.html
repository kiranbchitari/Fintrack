<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fintrack Tests</title>
<style>
:root{--bg:#f8f9fb;--surface:#fff;--line:#e2e6ec;--ink:#0f1419;--ink-3:#7b8491;--ok:#0f8a4a;--bad:#c43a3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--surface:#1a1e23;--line:#2b3138;--ink:#eef0f3;--ink-3:#88909b;--ok:#4cc47f;--bad:#ec6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--surface:#1a1e23;--line:#2b3138;--ink:#eef0f3;--ink-3:#88909b;--ok:#4cc47f;--bad:#ec6b6b;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{margin:0;font-size:1.4rem} h2{margin:0;font-size:1rem}
.sum{font-size:1.1rem;font-weight:600}
.sum.ok{color:var(--ok)} .sum.bad{color:var(--bad)}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.t{display:grid;grid-template-columns:22px 1fr;gap:6px}
.t .m{font-weight:700} .t.ok .m{color:var(--ok)} .t.bad .m{color:var(--bad)}
.t .d{color:var(--ink-3);font-size:.82rem;word-break:break-word}
</style>
</head>
<body>
<main class="wrap">
  <div><h1>Fintrack rule tests</h1><p style="margin:4px 0 0;color:var(--ink-3)">Runs the app's real rules on sample bank lines. Names and numbers are made up. Run this after every rule change; any red line means the change broke something that used to work.</p></div>
  <div class="sum" id="sum">Running…</div>
  <div id="out" style="display:grid;gap:16px"></div>
</main>
<script>window.PL_TEST = true;</script>
<script src="core.js"></script>
<script src="tests.js"></script>
</body>
</html>
