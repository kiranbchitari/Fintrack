/* Layout: a phone-width app shell (max 480px), header + scrolling screen + bottom tab bar */

<script>
"use strict";
pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";

/* ================= Android bridge (does nothing in a normal browser) ================= */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const plugin = n => NATIVE && Capacitor.Plugins && Capacitor.Plugins[n] || null;
// Hand a file to the user: Android share sheet (Save to Files, Drive, email…) or a normal browser download.
async function saveFile(name, text, mime){
  const fs = plugin("Filesystem"), share = plugin("Share");
  if (fs && share) {

/* ---- Encrypted SQLite database (Android). Tables: tx = one row per transaction, kv = rules, settings, import history. ---- */
const DB = "fintrack", sqlite = plugin("CapacitorSQLite");
const savedRows = new Map(); let savedKV = {}, dbQueue = Promise.resolve();
const rowSig = t => (t.catSrc === "you" ? t.cat : "") + "|" + (t.ok ? 1 : 0);
async function dbOpen(){
  if (!(await sqlite.isSecretStored()).result) {   // first run: make a random key; the plugin keeps it in Android's encrypted preferences
    const k = crypto.getRandomValues(new Uint8Array(32));
    await sqlite.setEncryptionSecret({ passphrase: [...k].map(b => b.toString(16).padStart(2, "0")).join("") });
  }
  await sqlite.createConnection({ database: DB, version: 1, encrypted: true, mode: "secret", readonly: false });
  await sqlite.open({ database: DB, readonly: false });
  await sqlite.execute({ database: DB, transaction: true, readonly: false, statements:
    `CREATE TABLE IF NOT EXISTS tx (id TEXT PRIMARY KEY NOT NULL, bank TEXT NOT NULL, acct TEXT NOT NULL, date TEXT NOT NULL, narration TEXT NOT NULL,
       amt REAL NOT NULL, dir TEXT NOT NULL, bal REAL, file TEXT, cat TEXT, ok INTEGER NOT NULL DEFAULT 0);
     CREATE INDEX IF NOT EXISTS tx_date ON tx(date);
     CREATE TABLE IF NOT EXISTS kv (k TEXT PRIMARY KEY NOT NULL, v TEXT NOT NULL);` });
}
async function dbLoad(){
  const q = async (statement) => (await sqlite.query({ database: DB, statement, values: [], readonly: false })).values || [];
  const rows = (await q("SELECT * FROM tx ORDER BY date, rowid")).filter(r => r.id);
  const kv = {}; (await q("SELECT k, v FROM kv")).forEach(r => { if (r.k) kv[r.k] = r.v; });
  return { rows: rows.map(r => ({ id: r.id, bank: r.bank, acct: r.acct, date: r.date, desc: r.narration, amt: r.amt, dir: r.dir, bal: r.bal, file: r.file, cat: r.cat || "", catSrc: r.cat ? "you" : "", ...(r.ok ? { ok: true } : {}) })), kv };
}
// Writes only what changed since the last save
function dbPersist(){
  const set = [], seen = new Set();
  for (const t of TX) {
    seen.add(t.id); const sig = rowSig(t), old = savedRows.get(t.id);
    if (old === undefined) set.push({ statement: "INSERT OR IGNORE INTO tx (id, bank, acct, date, narration, amt, dir, bal, file, cat, ok) VALUES (?,?,?,?,?,?,?,?,?,?,?)", values: [t.id, t.bank, t.acct, t.date, t.desc, t.amt, t.dir, t.bal, t.file || "", t.catSrc === "you" ? t.cat : "", t.ok ? 1 : 0] });
    else if (old !== sig) set.push({ statement: "UPDATE tx SET cat = ?, ok = ? WHERE id = ?", values: [t.catSrc === "you" ? t.cat : "", t.ok ? 1 : 0, t.id] });
    savedRows.set(t.id, sig);
  }
  for (const id of [...savedRows.keys()]) if (!seen.has(id)) { set.push({ statement: "DELETE FROM tx WHERE id = ?", values: [id] }); savedRows.delete(id); }
  for (const [k, v] of Object.entries({ rules: JSON.stringify(RULES), settings: JSON.stringify(SET), imports: JSON.stringify(IMPORTS) }))
    if (savedKV[k] !== v) { set.push({ statement: "INSERT OR REPLACE INTO kv (k, v) VALUES (?, ?)", values: [k, v] }); savedKV[k] = v; }
  for (let i = 0; i < set.length; i += 250) { const part = set.slice(i, i + 250);
    dbQueue = dbQueue.then(() => sqlite.executeSet({ database: DB, set: part, transaction: true, readonly: false })).catch(e => { console.error("db", e); notify("Couldn't save to the database: " + (e.message || e)); }); }
}
async function bootDatabase(){
  await dbOpen();
  const { rows, kv } = await dbLoad();
  const parse = (k, d) => { try { return kv[k] ? JSON.parse(kv[k]) : d; } catch { return d; } };
  if (rows.length || kv.settings) {
    TX = rows; RULES = parse("rules", {}); IMPORTS = parse("imports", []); SET = Object.assign({ me: "", family: "", small: 200, lock: false }, parse("settings", {}));
    rows.forEach(t => savedRows.set(t.id, rowSig(t))); savedKV = { rules: kv.rules, settings: kv.settings, imports: kv.imports };
  }
  persist = dbPersist;       // from here on, saving goes to the database
  if (!rows.length && TX.length) { dbPersist(); await dbQueue; }   // one-time move from the old browser storage
  ["tx", "rules", "settings", "imports"].forEach(k => { try { localStorage.removeItem("ft_" + k); } catch {} });
}

  const people = {}; rows.filter(t => ["Family", "Sent to people", "Received from people"].includes(t.cat)).forEach(t => { const p = people[t.payee] = people[t.payee] || { name: t.payee, out: 0, in: 0, fam: false }; p[t.dir] += t.amt; if (t.cat === "Family" || /family/i.test(t.why || "")) p.fam = true; });
  const plist = Object.values(people).sort((a, b) => (b.out + b.in) - (a.out + a.in)).slice(0, 12);
  const tile = (l, v, sub, cls = "") => `<div class="stat"><span>${l}</span><b class="num ${cls}">${v}</b>${sub ? `<span>${sub}</span>` : ""}</div>`;
  S(`<div class="chips" id="vchips">${[["overview","Overview"],["category","Category"],["merchant","Merchant"],["trend","Trend"]].map(([v, l]) => `<button class="chipbtn" data-v="${v}" aria-pressed="${repView === v}">${l}</button>`).join("")}</div>
    <div class="chips" id="rchips">${["", ...ms.slice().reverse()].map(m => `<button class="chipbtn" data-m="${m}" aria-pressed="${repMonth === m}">${m ? fmonth(m) : "Whole period"}</button>`).join("")}</div>
    <section class="card"><div class="sechead"><h2>Earned vs spent</h2><span class="muted">tap a month</span></div>

      <div class="tile3"><svg viewBox="0 0 24 24" style="stroke:var(--bad)"><path d="M3 7l6 6 4-4 8 8M15 17h6v-6"/></svg><span>Spent</span><b>${inr(f.spent)}</b></div>
      <div class="tile3"><svg viewBox="0 0 24 24" style="stroke:var(--ink)"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 7v5c0 1.7 3.6 3 8 3s8-1.3 8-3V7M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/></svg><span>Invested</span><b>${inr(f.invested)}</b></div></div>
    <section class="card"><div class="sechead"><h2>${repMonth ? fmonth(repMonth) : "Whole period"}</h2><span class="muted">${f.rate == null ? "" : `you kept ${pct(Math.max(0, f.rate))}`}</span></div>
      <div class="split">${tile("Earned", inr(f.income), "salary, interest, other", "in")}${tile("Spent on living", inr(f.spent), repMonth ? "" : `${inr(f.spent / nMonths)} a month`)}
        ${tile("Invested", inr(f.invested), f.withdrawn ? `${inr(f.withdrawn)} taken out` : "")}${tile("To family", inr(f.family), "")}
        ${tile("To other people", inr(f.people), f.received ? `${inr(f.received)} came back` : "")}${tile(f.saved >= 0 ? "Left after living costs" : "Overspent by", inr(Math.abs(f.saved)), "")}</div>
      <span class="muted">Moves between your own accounts are not counted.</span></section>
    <section class="card"><h2>Where living costs went</h2><div class="donutrow">${donut}
      <div class="dleg">${seg.map(([c, v, col]) => `<span><i class="lg" style="background:${col}"></i>${esc(c)}<b class="num">${pct(v / sumLiv)}</b></span>`).join("")}</div></div>
      <div class="bars">${cats.map(([c, [v, n]]) => { const pv = prevCat(c), ch = pv ? (v - pv) / pv : null; return `<button class="bar catbar" data-cat="${esc(c)}"><div class="h"><span class="cl">${catIcon(c)}${esc(c)} <span class="muted">· ${n}</span></span><span class="num">${inr(v)}${ch != null && Math.abs(ch) >= .1 ? ` <span class="delta ${ch > 0 ? "up" : "down"}">${ch > 0 ? "▲" : "▼"}${Math.min(999, Math.abs(Math.round(ch * 100)))}%</span>` : ""}</span></div><div class="trk"><div class="fill" style="width:${v / cats[0][1][0] * 100}%;background:${CATS[c][1]}"></div></div></button>`; }).join("")}</div>
      ${prevM ? `<span class="muted">Arrows compare with ${fmonth(prevM)}.</span>` : ""}</section>
    <section class="card"><div class="sechead"><h2>Day by day</h2><span class="muted">${fmonth(calM)} · darker is more</span></div>${cal}</section>
    <section class="card"><div class="sechead"><h2>Which days cost most</h2><span class="muted">average per day</span></div>
      <div class="wk">${wavg.map((v, i) => `<div class="wkc"><span class="num">${short(v)}</span><div class="wkb"><i style="height:${Math.max(3, v / wmax * 100)}%;${i === wtop ? "" : "opacity:.45"}"></i></div><span>${DOW[i]}</span></div>`).join("")}</div>
      <span class="muted">${DOWL[wtop]} cost you the most, about ${inr(wavg[wtop])} each.</span></section>
    <section class="card"><h2>Where you pay most</h2><div class="list flush">${topPay.map(([n, p]) => `<div class="rec">${av(n, p.t.cat, p.t.desc)}<div class="t"><b>${esc(n)}</b><span>${p.n} payment${p.n > 1 ? "s" : ""} · ${esc(p.t.cat)}</span></div><div class="a">${inr(p.v)}</div></div>`).join("")}</div></section>
    <section class="card"><h2>Biggest payments</h2><div class="list flush" id="biglist">${biggest.map(txRow).join("")}</div></section>
    ${plist.length ? `<section class="card"><h2>Money with people</h2><div class="list flush">${plist.map(p => { const d = p.out - p.in; return `<div class="rec">${av(p.name, "Sent to people")}<div class="t"><b>${esc(p.name)} ${p.fam ? '<span class="tag">family</span>' : ""}</b><span>sent ${inr(p.out)} · got ${inr(p.in)}</span></div><div class="a">${d > 0 ? inr(d) : d < 0 ? `<span class="in">${inr(-d)}</span>` : "even"}<small>${d > 0 ? "you gave more" : d < 0 ? "you got more" : ""}</small></div></div>`; }).join("")}</div></section>` : ""}`);
  const blocks = [...document.querySelectorAll("#screen > section, #screen > .tiles3")], kinds = ["overview", "overview", "overview", "category", "trend", "trend", "merchant", "merchant", "merchant"];
  const showView = () => { blocks.forEach((el, i) => el.hidden = kinds[i] !== repView); document.querySelectorAll("#vchips button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === repView)); };
  showView();
  $("#vchips").onclick = e => { const b = e.target.closest("[data-v]"); if (b) { repView = b.dataset.v; showView(); } };
  $("#rchips").onclick = e => { const b = e.target.closest("[data-m]"); if (b) { repMonth = b.dataset.m; Reports(); } };
  document.querySelectorAll(".cfhit").forEach(r => r.onclick = () => { repMonth = repMonth === r.dataset.m ? "" : r.dataset.m; const yv = window.scrollY; Reports(); window.scrollTo(0, yv); });
  document.querySelectorAll(".catbar").forEach(b => b.onclick = () => { txFilter = { q: "", cat: b.dataset.cat, month: repMonth, dir: "", check: false }; go("tx"); });
  document.querySelectorAll(".cald").forEach(b => b.onclick = () => { txFilter = { q: "", cat: "", month: "", dir: "out", check: false, day: b.dataset.day }; go("tx"); });
  $("#biglist").onclick = e => { const r = e.target.closest(".row"); if (r) openTx(r.dataset.id); };
}
function Add(){
  S(`<div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose statement PDFs"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>Add bank statements</b><span class="muted">PDF from any of your banks. Pick several at once. Transactions you already added are skipped automatically.</span>
      <button class="btn primary" type="button">Choose PDF files</button></div>
    <section class="card"><h2>This session</h2><div class="log" id="log"><span class="muted">Nothing added yet.</span></div></section>
    <section class="card"><h2>Added before</h2>${IMPORTS.length ? IMPORTS.slice().reverse().slice(0, 12).map(i => `<div class="logitem"><i class="dot ok"></i><div><b>${esc(i.bank)} ••${esc(i.acct)}</b> <span class="muted">${esc(i.at)}</span><div class="muted">${i.added} new, ${i.dup} skipped · ${esc(i.name)}</div></div></div>`).join("") : '<span class="muted">No statements yet.</span>'}</section>`);
  const d = $("#drop");
  d.onclick = () => $("#file").click();
  d.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#file").click(); } };
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); const f = [...e.dataTransfer.files].filter(f => /pdf$/i.test(f.name) || f.type === "application/pdf"); if (f.length) importFiles(f); };
}
$("#file").onchange = e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) importFiles(f).then(() => { const l = $("#log"); if (l && l.firstChild?.nodeName === "#text") l.firstChild.remove(); }); };

function Settings(){
  const accts = {}; TX.forEach(t => { const k = t.bank + " ••" + t.acct; const a = accts[k] = accts[k] || { n: 0, from: t.date, to: t.date }; a.n++; a.to = t.date; });
  S(`<section class="card"><div class="menu">
      <button data-go="recurring"><span>Recurring payments<small>Auto-debits, bills, SIPs and what's due next</small></span><span aria-hidden="true">›</span></button>
      <button data-go="check"><span>Please check<small>${TX.filter(needsCheck).length} payments the rules weren't sure about</small></span><span aria-hidden="true">›</span></button>
      <button data-go="add"><span>Add statements<small>Pick bank statement PDFs</small></span><span aria-hidden="true">›</span></button></div></section>
    <section class="card"><h2>Your accounts</h2>${Object.keys(accts).length ? Object.entries(accts).map(([k, a]) => `<div class="logitem"><i class="dot ok"></i><div><b>${esc(k)}</b><div class="muted">${a.n} transactions · ${fdate(a.from)} ${a.from.slice(0,4)} to ${fdate(a.to)} ${a.to.slice(0,4)}</div></div></div>`).join("") : '<span class="muted">None yet.</span>'}</section>
    <section class="card"><h2>Help it understand you</h2>
      <div class="field"><label for="me">Your own names and UPI IDs</label><input id="me" value="${esc(SET.me)}" placeholder="e.g. your full name, 98xxxxxx@upi"><span class="muted">Payments with these are counted as moves between your own accounts. Matching amounts between your accounts are found automatically too.</span></div>
      <div class="field"><label for="fam">Family names</label><input id="fam" value="${esc(SET.family)}" placeholder="e.g. surname, mother's name"><span class="muted">Comma separated. Matching payments go under Family.</span></div>
      <div class="field"><label for="small">Small payment limit (₹)</label><input id="small" type="number" min="10" value="${SET.small}"></div>
      <button class="btn primary" id="saveSet">Save and re-sort</button></section>
    <section class="card"><h2>What you taught it</h2>${Object.keys(RULES).length ? Object.entries(RULES).map(([k, c]) => `<div class="sechead"><span>${esc(TX.find(t => pkey(t.payee) === k)?.payee || k)} → <b>${esc(c)}</b></span><button class="btn small danger" data-rule="${esc(k)}">Remove</button></div>`).join("") : '<span class="muted">Tap any transaction to change its category. It remembers for next time.</span>'}</section>
    <section class="card"><h2>Saved PDF passwords</h2><span class="muted">Tried automatically on new statements. ${NATIVE ? "Kept encrypted in this phone's keystore." : "Stored only on this device."}</span>
      ${PW.length ? PW.map((p, i) => `<div class="sechead"><span>${esc(p.label || "Statement")} <span class="muted num">••••${esc(String(p.pw).slice(-2))}</span></span><button class="btn small danger" data-pw="${i}">Forget</button></div>`).join("") : '<span class="muted">None saved.</span>'}</section>
    ${NATIVE ? `<section class="card"><div class="sechead"><h2>App lock</h2><span class="tag ${SET.lock ? "ok" : ""}">${SET.lock ? "On" : "Off"}</span></div>
      <span class="muted">Ask for your fingerprint or the phone's screen lock when Fintrack opens, and again after 30 seconds in the background.</span>
      <div class="btns" style="justify-content:flex-start"><button class="btn ${SET.lock ? "" : "primary"}" id="lockToggle">${SET.lock ? "Turn off app lock" : "Turn on app lock"}</button></div>
      <span class="muted" id="lockNote"></span></section>` : ""}
    <section class="card"><h2>Where your data is kept</h2>
      <span class="muted">${NATIVE ? "Transactions, categories and settings are in an encrypted database inside this app. Saved PDF passwords are in the phone's keystore. Statement PDFs are read and not kept." : "In this browser's storage on this device. The Android app uses an encrypted database instead."} Nothing is uploaded. Uninstalling the app deletes it all, so keep a backup.</span></section>
    <section class="card"><h2>Back up and restore</h2>
      <span class="muted">A backup is one file with all ${TX.length} transactions, the categories you set and what you taught the app. Keep it somewhere safe (Drive, email to yourself). If this phone or the app's data is lost, restore from it.</span>
      <label class="check"><input type="checkbox" id="bkPw"> Include saved PDF passwords in the backup</label>
      <div class="btns" style="justify-content:flex-start"><button class="btn primary" id="bkSave">Save backup file</button><button class="btn" id="bkLoad">Restore from backup</button></div>
      <input type="file" id="bkFile" accept="application/json,.json" hidden>
      <span class="muted" id="bkNote">Restoring adds what is missing. It never deletes or overwrites what is already here.</span></section>
    <section class="card"><h2>Your data</h2><div class="btns" style="justify-content:flex-start"><button class="btn" id="csv">Download CSV (for Excel)</button><button class="btn danger" id="wipe">Delete everything</button></div>
      <span class="muted">Everything is kept on this device. Nothing is uploaded.</span></section>`);
  const lt = $("#lockToggle");
  if (lt) lt.onclick = async () => {
    if (!SET.lock && !(await canLock())) { $("#lockNote").innerHTML = '<span style="color:var(--warn)">Set a screen lock (PIN, pattern or fingerprint) in the phone\'s settings first.</span>'; return; }
    try { authBusy = true; await bio.internalAuthenticate({ reason: SET.lock ? "Turn off app lock" : "Turn on app lock", androidTitle: SET.lock ? "Turn off app lock" : "Turn on app lock", allowDeviceCredential: true, androidConfirmationRequired: false }); }
    catch { authBusy = false; $("#lockNote").textContent = "Not changed."; return; }
    authBusy = false; awaySince = 0; SET.lock = !SET.lock; save(); toast(SET.lock ? "App lock is on." : "App lock is off."); go("settings");
  };
  $("#bkSave").onclick = () => {
    saveFile(`fintrack-backup-${today()}.json`, JSON.stringify(makeBackup($("#bkPw").checked)), "application/json")
      .then(how => { store.set("lastBackup", today()); toast(how === "shared" ? "Backup ready. Choose where to keep it." : "Backup saved to your downloads."); })
      .catch(e => { if (!/cancel/i.test(e.message || "")) toast("Couldn't save the backup: " + (e.message || e)); });
  };
  $("#bkLoad").onclick = () => $("#bkFile").click();
  $("#bkFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { const r = restoreBackup(JSON.parse(await f.text())); toast(`Restored: ${r.added} added, ${r.skipped} already here` + (r.rules ? `, ${r.rules} rules` : "")); go("settings"); }
    catch (err) { $("#bkNote").innerHTML = `<span style="color:var(--bad)">${esc(err instanceof SyntaxError ? "That file isn't a readable backup." : err.message)}</span>`; }
  };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => b.dataset.go === "check" ? reviewNow() : go(b.dataset.go));
  $("#saveSet").onclick = () => { SET.me = $("#me").value; SET.family = $("#fam").value; SET.small = +$("#small").value || 200; recategoriseAll(); toast("Saved. Transactions re-sorted."); };
  document.querySelectorAll("[data-rule]").forEach(b => b.onclick = () => { delete RULES[b.dataset.rule]; recategoriseAll(); go("settings"); });
  document.querySelectorAll("[data-pw]").forEach(b => b.onclick = () => { PW.splice(+b.dataset.pw, 1); savePw(); go("settings"); });
  $("#csv").onclick = () => {
    const rows = [["Date","Bank","Account","Payee","Category","Type","Out","In","Balance","Bank text"], ...TX.map(t => [t.date, t.bank, t.acct, t.payee, t.cat, t.channel, t.dir === "out" ? t.amt : "", t.dir === "in" ? t.amt : "", t.bal ?? "", t.desc])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    saveFile(`fintrack-${today()}.csv`, "\ufeff" + csv, "text/csv").catch(e => { if (!/cancel/i.test(e.message || "")) toast("Couldn't save the file: " + (e.message || e)); });
  };
  $("#wipe").onclick = () => sheet(`<h3>Delete all data?</h3><p class="muted">This removes ${TX.length} transactions, your categories and saved passwords from this device. It can't be undone.</p><div class="btns"><button class="btn" data-close>Keep</button><button class="btn primary" id="yes" style="background:var(--bad);border-color:var(--bad)">Delete everything</button></div>`,
    r => r.querySelector("#yes").onclick = () => { TX = []; PW = []; savePw(); RULES = {}; IMPORTS = []; ["tx","pw","rules","imports"].forEach(k => { try { localStorage.removeItem("ft_" + k); } catch {} }); save(); closeSheet(); go("home"); toast("All data deleted."); });
}

/* ================= sheet + password prompt ================= */
let sheetEl = null;
function sheet(html, init){
  closeSheet();
  sheetEl = document.createElement("div"); sheetEl.className = "scrim";
  sheetEl.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  sheetEl.onclick = e => { if (e.target === sheetEl || e.target.closest("[data-close]")) { sheetEl.dispatchEvent(new Event("cancel")); closeSheet(); } };
  document.body.append(sheetEl);
  init && init(sheetEl);
  (sheetEl.querySelector("input,select,button.primary") || sheetEl).focus();
  return sheetEl;
}
function closeSheet(){ if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
addEventListener("keydown", e => { if (e.key === "Escape" && sheetEl) { sheetEl.dispatchEvent(new Event("cancel")); closeSheet(); } });
function askPassword(name, wrong){
  return new Promise(res => {
    const el = sheet(`<h3>Password needed</h3><p class="muted" style="margin:0">${esc(name)} is locked. Banks usually use your customer ID, date of birth or part of your account number.</p>
      ${wrong ? '<div class="err" role="alert">That password didn\'t work. Try again.</div>' : ""}
      <div class="field"><label for="pwIn">PDF password</label><input id="pwIn" type="password" autocomplete="off"></div>
      <label class="check"><input type="checkbox" id="pwRem" checked> Remember on this device</label>
      <div class="btns"><button class="btn" data-close>Skip this file</button><button class="btn primary" id="pwGo">Unlock</button></div>`, r => {
        const go2 = () => { const pw = r.querySelector("#pwIn").value; if (!pw) return; const rem = r.querySelector("#pwRem").checked; closeSheet(); res({ pw, remember: rem }); };
        r.querySelector("#pwGo").onclick = go2;
        r.querySelector("#pwIn").onkeydown = e => { if (e.key === "Enter") go2(); };
        r.addEventListener("cancel", () => res(null));
      });
  });
}

/* ================= boot ================= */
document.querySelector("nav.tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.tab); };
$("#fab").onclick = () => go("add");
$("#backBtn").onclick = () => go(current === "recurring" ? "settings" : "home");
window.PL = { importBuffer, detectRecurring, get TX(){ return TX; } };
function startApp(){ recategoriseAll(); go(TX.length ? "home" : "add"); loadSecurePw(); cleanTempFiles(); if (SET.lock && bio) lockScreen(); }
if (sqlite) bootDatabase().catch(e => { console.error("db boot", e); notify("The database couldn't be opened, so this session uses temporary storage: " + (e.message || e)); }).then(startApp);
else startApp();
try { const sb = plugin("SystemBars"); if (sb) sb.setStyle({ style: "DARK" }); } catch {}
// Android back button: close an open sheet, else go back to Spends, else leave the app
const appPlugin = plugin("App");
// Lock again after the app has been in the background for 30 seconds
if (appPlugin) appPlugin.addListener("appStateChange", st => {
  if (authBusy) return;
  if (!st.isActive) awaySince = Date.now();
  else if (SET.lock && bio && awaySince && Date.now() - awaySince > 30000) lockScreen();
});
if (appPlugin) appPlugin.addListener("backButton", () => { if (locked) return appPlugin.exitApp(); if (sheetEl) { sheetEl.dispatchEvent(new Event("cancel")); closeSheet(); } else if (current !== "home" && TX.length) go(current === "recurring" ? "settings" : "home"); else appPlugin.exitApp(); });
</script>
