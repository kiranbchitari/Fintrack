/* Layout: a phone-width app shell (max 480px), header + scrolling screen + bottom tab bar */
:root{

  --in:#0f8a4a; --warn:#a86400; --bad:#c43a3a; --warn-bg:#fdf3e2; --bad-bg:#fbe9e9; --good-bg:#e7f5ec;
  --s-in:#1baf7a; --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif; --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d10; --app:#111418; --surface:#1a1e23; --line:#2b3138; --ink:#eef0f3; --ink-2:#b3bac4; --ink-3:#88909b;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#16233a;
  --in:#4cc47f; --warn:#e6a23c; --bad:#ec6b6b; --warn-bg:#2d2414; --bad-bg:#301919; --good-bg:#16291f; --s-in:#199e70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d10; --app:#111418; --surface:#1a1e23; --line:#2b3138; --ink:#eef0f3; --ink-2:#b3bac4; --ink-3:#88909b;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#16233a;
  --in:#4cc47f; --warn:#e6a23c; --bad:#ec6b6b; --warn-bg:#2d2414; --bad-bg:#301919; --good-bg:#16291f; --s-in:#199e70; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--app);display:flex;flex-direction:column;position:relative}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

nav.tabs{position:sticky;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(4px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.7rem;color:var(--ink-3);cursor:pointer;border-radius:10px}

.tab:focus-visible,.btn:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font:600 1.02rem var(--display);margin:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}

.ins.watch{background:var(--warn-bg)} .ins.alert{background:var(--bad-bg)}

.bars{display:grid;gap:10px}

.chart svg{width:100%;height:auto;display:block}

.ringbig{font:600 17px var(--display);fill:var(--ink)} .ringsub{font:11px var(--body);fill:var(--ink-3)} .donutbig{font:600 20px var(--display);fill:var(--ink)}
.kpis{display:grid;gap:8px}

button.ins:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.cald.l1{background:color-mix(in srgb,var(--accent) 16%,var(--surface))} .cald.l2{background:color-mix(in srgb,var(--accent) 34%,var(--surface))}
.cald.l3{background:color-mix(in srgb,var(--accent) 55%,var(--surface));color:#fff} .cald.l4{background:color-mix(in srgb,var(--accent) 78%,var(--surface));color:#fff} .cald.l5{background:var(--accent);color:#fff}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}

<div class="app">
  <header class="top"><div><h1 id="title">Spends</h1><div class="sub" id="subtitle"></div></div><button class="btn small" id="addBtn" aria-label="Add statements">+ Add</button></header>

<script>
"use strict";
pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";

/* ================= Android bridge (does nothing in a normal browser) ================= */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const plugin = n => NATIVE && Capacitor.Plugins && Capacitor.Plugins[n] || null;
// Hand a file to the user: Android share sheet (Save to Files, Drive, email…) or a normal browser download.
async function saveFile(name, text, mime){
  const fs = plugin("Filesystem"), share = plugin("Share");
  if (fs && share) {
    const w = await fs.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });
    await share.share({ title: name, files: [w.uri], dialogTitle: "Save or send " + name });
    return "shared";
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click();
  return "downloaded";
}
// Saved PDF passwords live in the Android Keystore (encrypted), not in plain app storage.
async function loadSecurePw(){
  const ss = plugin("SecureStorage"); if (!ss) return;
  savePw = () => { ss.internalSetItem({ prefixedKey: "ft_pw", data: JSON.stringify(PW), sync: false, access: 0 }).catch(e => notify("Couldn't save the password securely: " + (e.message || e))); };
  try {
    const r = await ss.internalGetItem({ prefixedKey: "ft_pw", sync: false });
    const fromKeystore = r && r.data ? JSON.parse(r.data) : [];
    const legacy = store.get("pw", []);            // anything left in plain storage moves into the keystore once
    PW = [...fromKeystore, ...legacy.filter(p => !fromKeystore.find(x => x.pw === p.pw))];
    if (legacy.length) { savePw(); try { localStorage.removeItem("ft_pw"); } catch {} }
  } catch (e) { console.warn("secure storage", e); }
}
notify = msg => toast(msg);
const $ = s => document.querySelector(s);
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3200); }

/* ================= import ================= */
async function importFiles(files){
  go("add");
  const log = $("#log");
  log.querySelector(":scope > .muted")?.remove();
  for (const f of files) {
    const li = document.createElement("div"); li.className = "logitem";
    li.innerHTML = `<i class="dot busy"></i><div><b>${esc(f.name)}</b><div class="muted">Opening…</div></div>`;
    log.prepend(li);
    const say = (msg, st) => { li.querySelector(".muted").innerHTML = msg; if (st) li.querySelector(".dot").className = "dot " + st; };
    try {
      const buf = await f.arrayBuffer();
      const r = await importBuffer(f.name, buf, wrong => askPassword(f.name, wrong));
      if (!r) { say("Skipped. No password given.", "bad"); continue; }
      say(`${r.bank} ••${esc(r.acct)} · <b>${r.added} new</b>, ${r.dup} already added` + (r.issues ? ` · <span style="color:var(--warn)">${r.issues} rows to check</span>` : " · balances check out"), r.added || r.dup ? "ok" : "bad");
    } catch (e) { console.error(e); say("Couldn't read this file: " + esc(e.message || e), "bad"); }
    setSubtitle();
  }
}

/* ================= screens ================= */
const TITLES = { home: "Overview", tx: "Spends", recurring: "Recurring", reports: "Reports", settings: "Settings", add: "Add statements" };
let current = "home", txFilter = { q: "", cat: "", month: "", dir: "", check: false, day: "" };
function setSubtitle(){
  $("#subtitle").textContent = TX.length ? `${fdate(TX[0].date)} ${TX[0].date.slice(0,4)} – ${fdate(TX[TX.length-1].date)} ${TX[TX.length-1].date.slice(0,4)}` : "No statements yet";
}
function go(tab){
  current = tab;
  document.querySelectorAll(".tab").forEach(b => b.toggleAttribute("aria-current", b.dataset.tab === tab) || b.dataset.tab === tab && b.setAttribute("aria-current", "page"));
  document.querySelectorAll(".tab").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  $("#title").textContent = TITLES[tab];
  setSubtitle();
  ({ home: Home, tx: Spends, recurring: Recurring, reports: Reports, settings: Settings, add: Add })[tab]();
  window.scrollTo(0, 0);
}
const S = html => ($("#screen").innerHTML = html);
const grp = t => (CATS[t.cat] || ["living"])[0];
const PEOPLE_CATS = ["Sent to people", "Received from people", "Family", "Own accounts"];
function av(name, cat, text){
  const col = (CATS[cat] || [0, "#7b8491"])[1], br = brandOf(stripBanks(text || "") + " " + (name || ""));
  if (br && !PEOPLE_CATS.includes(cat) && /\.png$/.test(br[4] || "")) return `<span class="av brand img" aria-hidden="true"><img src="logos/${br[4]}" alt="" loading="lazy"></span>`;
  if (br && !PEOPLE_CATS.includes(cat)) return br[4] && LOGOS[br[4]]
    ? `<span class="av brand logo" style="background:${br[2]}" aria-hidden="true"><svg viewBox="0 0 24 24" style="fill:${br[3]}"><path d="${LOGOS[br[4]]}"/></svg></span>`

/* ---------- small chart helpers (plain SVG, no library) ---------- */
const niceStep = max => [1e3, 2e3, 5e3, 1e4, 2e4, 25e3, 5e4, 1e5, 2e5, 25e4, 5e5, 1e6, 2e6].find(s => max / s <= 4) || 5e6;
const pct = x => Math.round(x * 100) + "%";
function sparkArea(vals, W, H, stroke, fill){
  if (vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, 4 + (H - 8) * (1 - (v - mn) / sp)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block" aria-hidden="true"><path d="${line} L${W},${H} L0,${H} Z" fill="${fill}"/><path d="${line}" fill="none" stroke="${stroke}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function ring(frac, label, sub){
  const r = 34, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<svg viewBox="0 0 88 88" class="ringsvg" role="img" aria-label="${label} ${sub}"><circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="44" cy="44" r="${r}" fill="none" stroke="${frac < 0 ? "var(--bad)" : "var(--in)"}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(f * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 44 44)"/>
    <text x="44" y="43" text-anchor="middle" class="ringbig">${label}</text><text x="44" y="57" text-anchor="middle" class="ringsub">${sub}</text></svg>`;
}
function paceChart(cm, pm){
  const cur = paceSeries(cm), prev = pm ? paceSeries(pm) : [], lastDay = +TX[TX.length - 1].date.slice(8);
  const curCut = cur.slice(0, lastDay), W = 440, H = 180, pl = 44, pr = 8, pt = 10, pb = 22, iw = W - pl - pr, ih = H - pt - pb;
  const max = Math.max(...curCut, ...prev, 1), step = niceStep(max), top = Math.ceil(max / step) * step, n = Math.max(cur.length, prev.length);
  const x = i => pl + i / (n - 1) * iw, y = v => pt + ih - v / top * ih, path = a => a.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending so far this month compared with last month">`;
  for (let v = 0; v <= top; v += step) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v ? short(v) : "0"}</text>`;
  [1, 10, 20, n].forEach(d => s += `<text x="${x(d - 1)}" y="${H - 6}" text-anchor="${d === n ? "end" : d === 1 ? "start" : "middle"}">${d}</text>`);
  if (prev.length) s += `<path d="${path(prev)}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="4 4"/>`;
  s += `<path d="${path(curCut)} L${x(curCut.length - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--accent)" opacity=".12"/><path d="${path(curCut)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(curCut.length - 1)}" cy="${y(curCut[curCut.length - 1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>`;
  return { svg: s, now: curCut[curCut.length - 1], then: prev.length ? prev[Math.min(lastDay, prev.length) - 1] : null, day: lastDay };
}

function insights(){
  const out = [], ms = monthsList(); if (!ms.length) return out;
  const living = TX.filter(t => t.dir === "out" && grp(t) === "living"), all = flow(TX);
  const span = Math.max(1, days(TX[0].date, TX[TX.length - 1].date) + 1), perMonth = all.spent / span * 30.4;
  const add = (kind, title, body, go) => out.push({ kind, title, body, go });
  if (all.income) add(all.rate >= .2 ? "good" : "watch", `You keep ${pct(Math.max(0, all.rate))} of what you earn`, `Earned ${inr(all.income)}, spent ${inr(all.spent)} on living costs (about ${inr(perMonth)} a month). The rest went to savings, investments, family and friends.`);
  if (all.income && all.invested) add("info", `${pct((all.invested - all.withdrawn) / all.income)} of your income stayed invested`, `Put in ${inr(all.invested)}, took out ${inr(all.withdrawn)}.`, { cat: "Investments" });
  if (ms.length >= 4) { // a category that is rising
    const full = ms.slice(0, -1), last = full[full.length - 1], prev3 = full.slice(-4, -1), rises = [];
    for (const c of Object.keys(CATS).filter(c => CATS[c][0] === "living")) {
      const v = m => TX.filter(t => t.cat === c && t.dir === "out" && t.date.startsWith(m)).reduce((a, t) => a + t.amt, 0);
      const now = v(last), avg = prev3.reduce((a, m) => a + v(m), 0) / prev3.length;
      if (now > 2000 && now > avg * 1.5) rises.push([c, now, avg]);
    }
    rises.sort((a, b) => (b[1] - b[2]) - (a[1] - a[2])).slice(0, 2).forEach(([c, now, avg]) => add("watch", `${c} jumped in ${fmonth(last)}`, avg >= 500 ? `${inr(now)} against a usual ${inr(avg)} a month.` : `${inr(now)}, where you usually spend almost nothing.`, { cat: c, month: last }));
  }
  unusual(TX.filter(t => t.date >= addDays(TX[TX.length - 1].date, -45))).slice(-2).forEach(t => add("watch", `Unusually large payment to ${t.payee}`, `${inr(t.amt)} on ${fdate(t.date)}, more than 3 times your usual there.`, { q: t.payee }));
  const rec = detectRecurring().filter(r => r.active && r.dir === "out" && ["Bills & recharges", "Insurance", "Subscriptions", "Loan EMI", "Rent & housing", "Education"].includes(r.cat));
  if (rec.length) add("info", `Regular bills cost you about ${inr(rec.reduce((a, r) => a + r.monthly, 0) * 12)} a year`, rec.slice(0, 4).map(r => `${r.payee} ${inr(r.monthly)}/mo`).join(" · "), { tab: "recurring" });
  detectRecurring().filter(r => r.active && r.dir === "out" && r.change > 0).slice(0, 2).forEach(r => add("watch", `${r.payee} went up by ${inr(r.change)}`, `Last payment ${inr(r.typ + r.change)} against a usual ${inr(r.typ)}.`, { q: r.payee }));
  const tiny = living.filter(t => t.amt <= SET.small);
  if (tiny.length > 20) add("watch", `${tiny.length} small payments of ${inr(SET.small)} or less came to ${inr(tiny.reduce((a, t) => a + t.amt, 0))}`, `About ${inr(tiny.reduce((a, t) => a + t.amt, 0) / span * 30.4)} a month on tea, snacks, rides and small shops.`);
  const charges = TX.filter(t => t.cat === "Bank charges");
  if (charges.length) add("alert", `Banks charged you ${inr(charges.reduce((a, t) => a + t.amt, 0))} in fees and penalties`, charges.map(t => `${t.bank} ${fdate(t.date)} ${inr(t.amt)}`).slice(0, 4).join(" · "), { cat: "Bank charges" });
  if (TX.some(t => /RET CH|ACH RET|ECS RET|INSUF/i.test(t.desc))) add("alert", "An auto-debit bounced for low balance", "Keep enough in the account before auto-debit dates. See Recurring for the dates.", { tab: "recurring" });
  const ppl = {}; TX.filter(t => ["Sent to people", "Received from people"].includes(t.cat)).forEach(t => { const p = ppl[t.payee] = ppl[t.payee] || [0, 0]; p[t.dir === "out" ? 0 : 1] += t.amt; });
  Object.entries(ppl).filter(([, [o, i]]) => i > 0 && o - i >= 10000).sort((a, b) => (b[1][0] - b[1][1]) - (a[1][0] - a[1][1])).slice(0, 2)
    .forEach(([n, [o, i]]) => add("info", `${n} has ${inr(o - i)} more from you than came back`, `You sent ${inr(o)} and received ${inr(i)}. Worth a check if it was a loan.`, { q: n }));
  if (ms.length >= 3) {
    const vals = ms.map(m => [m, flow(inMonth(m)).spent]), avg = vals.reduce((a, v) => a + v[1], 0) / vals.length, top = vals.reduce((a, v) => v[1] > a[1] ? v : a);
    if (top[1] > avg * 1.4) add("info", `${fmonth(top[0])} was your most expensive month: ${inr(top[1])}`, `Your average is ${inr(avg)}.`, { month: top[0] });
  }
  return out;
}

function Recurring(){

if (appPlugin) appPlugin.addListener("backButton", () => { if (sheetEl) { sheetEl.dispatchEvent(new Event("cancel")); closeSheet(); } else if (current !== "tx" && TX.length) go("tx"); else appPlugin.exitApp(); });
